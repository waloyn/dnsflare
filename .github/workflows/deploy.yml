name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 注意事项:
      # 1. 这里必须执行 `yarn build` (vite build), 不要执行 `yarn build:manual`;
      # 2. wrangler 会自动包含仓库根目录的 `functions/` 目录作为 /api 代理的 Pages Functions,
      #    所以构建后要删除 dist/_worker.js, 避免与 functions/ 冲突 (advanced mode 会接管全部请求);
      # 3. `yarn build:manual` 仅用于 Cloudflare 后台直接上传 zip 的手动部署流程。
      - name: Type check
        run: yarn typecheck

      - name: Build frontend
        run: |
          yarn build
          rm -f dist/_worker.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dnsflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
